<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Prompt Library</h1>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading" class="panel-title">Add Prompt</h2>
      <form id="prompt-form" novalidate>
        <div class="field-group">
          <label for="prompt-title">Title</label>
          <input type="text" id="prompt-title" name="title" placeholder="e.g. Blog Idea Generator" maxlength="120" required />
          <p class="field-hint" id="title-hint">Required. Max 120 characters.</p>
        </div>
        <div class="field-group">
          <label for="prompt-content">Content</label>
          <textarea id="prompt-content" name="content" placeholder="Enter the full prompt here..." rows="6" required></textarea>
          <p class="field-hint" id="content-hint">Required.</p>
        </div>
        <div class="actions">
          <button type="submit" id="save-btn">Save Prompt</button>
        </div>
        <div id="form-error" class="form-error" role="alert" aria-live="polite"></div>
      </form>
    </section>

    <section class="panel" aria-labelledby="saved-prompts-heading">
      <div class="panel-header">
        <h2 id="saved-prompts-heading" class="panel-title">Saved Prompts</h2>
        <span id="prompt-count" class="count-badge" aria-live="polite"></span>
      </div>
      <div id="prompts-empty" class="empty-state" hidden>
        <p>No prompts saved yet. Add your first one!</p>
      </div>
      <div id="prompts-list" class="cards" aria-live="polite"></div>
    </section>
  </main>

  <template id="prompt-card-template">
    <article class="card" data-id="">
      <div class="card-main">
        <h3 class="card-title"></h3>
        <div class="rating-container" data-prompt-id="">
          <button class="star-btn" data-rating="1" aria-label="1 star">☆</button>
          <button class="star-btn" data-rating="2" aria-label="2 stars">☆</button>
          <button class="star-btn" data-rating="3" aria-label="3 stars">☆</button>
          <button class="star-btn" data-rating="4" aria-label="4 stars">☆</button>
          <button class="star-btn" data-rating="5" aria-label="5 stars">☆</button>
        </div>
        <p class="card-preview"></p>
        
        <!-- Notes Section -->
        <div class="notes-section" data-prompt-id="">
          <div class="notes-header">
            <button class="notes-toggle-btn" type="button" aria-label="Toggle notes section">
              <span class="notes-title">Notes</span>
              <span class="notes-count">(0)</span>
              <span class="toggle-icon">▼</span>
            </button>
            <button class="add-note-btn" type="button" aria-label="Add new note">+ Add Note</button>
          </div>
          
          <div class="notes-content" style="display: none;">
            <div class="notes-list"></div>
            
            <!-- Add Note Form -->
            <div class="add-note-form" style="display: none;">
              <textarea class="note-textarea" placeholder="Write your note here..." maxlength="500" rows="3"></textarea>
              <div class="note-form-footer">
                <div class="char-counter">0/500</div>
                <div class="note-form-actions">
                  <button class="save-note-btn" type="button">Save</button>
                  <button class="cancel-note-btn" type="button">Cancel</button>
                </div>
              </div>
              <div class="note-error" style="display: none;"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="delete-btn" type="button" aria-label="Delete prompt">Delete</button>
      </div>
    </article>
  </template>

  <footer class="app-footer">Local-only storage. Clearing browser data will remove prompts.</footer>

  <script src="script.js"></script>
</body>
</html>
